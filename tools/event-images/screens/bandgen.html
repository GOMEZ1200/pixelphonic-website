<html><body style="margin:0"><canvas id=c width=400 height=80></canvas><script>
const i=new Image();i.onload=()=>{const g=document.getElementById('c').getContext('2d');
// left half from a clean column left of the text, right half from a clean column right of it, blended
g.drawImage(i,688,336,4,80,0,0,200,80);g.drawImage(i,1100,336,4,80,200,0,200,80);
const d=g.getImageData(0,0,400,80);const L=g.getImageData(0,0,1,80).data,Rr=g.getImageData(399,0,1,80).data;
