<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1600px;height:1200px;background:#000;overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.w{position:absolute;inset:0;display:flex;gap:70px;align-items:center;justify-content:center}
.c{position:relative;width:640px;height:620px;border-radius:36px;background:linear-gradient(#1c1c1c 0 49.6%,#0a0a0a 49.6% 50.4%,#161616 50.4%);box-shadow:0 10px 30px rgba(0,0,0,.8),inset 0 2px 0 rgba(255,255,255,.06)}
.c span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e9e9e9;font-size:470px;font-weight:700;letter-spacing:-18px}
.c:after{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;background:#000}
</style></head><body><div class="w"><div class="c"><span>11</span></div><div class="c"><span>15</span></div></div></body></html>
