<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="slides.css"><style>
/* PowerPoint Presenter View (newer layout with thumbnail strip), 1920x1200 MacBook Pro screen. */
html,body{margin:0;width:1920px;height:1200px;background:#262626;color:#ddd;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;overflow:hidden}
.top{height:70px;display:flex;gap:44px;align-items:center;padding:0 40px;font-size:20px;color:#ccc}
.top span:before{content:"▢ ";opacity:.6}
.timer{position:absolute;left:40px;top:84px;font-size:26px;color:#eee}
.clock{position:absolute;left:975px;top:84px;font-size:26px;color:#eee}
.cur{position:absolute;left:40px;top:130px;width:1020px;height:574px;border-radius:12px;font-size:1px}
.cur .mark{font-size:110px}
.tools{position:absolute;left:40px;top:722px;font-size:30px;letter-spacing:14px;opacity:.8}
.nav{position:absolute;left:330px;top:760px;font-size:22px}
.next{position:absolute;left:1140px;top:170px;font-size:22px}
.nx{position:absolute;left:1260px;top:150px;width:470px;height:264px;border-radius:6px}
.nx .script{font-size:60px}.nx .stars{font-size:22px}
.notes{position:absolute;left:1140px;top:470px;font-size:22px;color:#aaa}
.strip{position:absolute;left:0;right:0;bottom:0;height:300px;display:flex;gap:24px;align-items:center;padding:0 30px;background:#1d1d1d}
.th{flex:0 0 250px;height:150px;border-radius:6px;background:#eee;color:#333;display:grid;place-items:center;font:700 26px/1.1 Arial;text-align:center}
.th.on{outline:6px solid #e0201b}
.th .mark{font-size:26px}.th .slide{width:100%;height:100%}
</style></head><body>
<div class="top"><span>Show Taskbar</span><span>Display Settings ▾</span><span>End Slide Show</span></div>
<div class="timer">0:42:18 ❚❚ ↺</div><div class="clock">17:47</div>
<div class="cur slide ppt"><div class="mark"><svg viewBox="0 0 40 30"><path d="M4 26 L20 4 L36 26" fill="none" stroke="#fff" stroke-width="5"/><circle cx="20" cy="8" r="3" fill="#fff"/></svg>HARBOUR<br>LIGHTS</div></div>
<div class="tools">✎ ▦ ⌕ ▬ ▭ ⋯</div>
<div class="nav">◀ &nbsp;Slide 14 of 38&nbsp; ▶</div>
<div class="next">Next slide</div><div class="nx slide hold"><div><div class="stars">★ ★ ★</div><div class="script">Harbour Lights</div></div></div>
<div class="notes">Click to add notes</div>
<div class="strip">
  <div class="th">Northgate<br>Builders</div><div class="th">Lumen<br>Print</div><div class="th" style="background:#2e86de;color:#fff">Riverside<br>Dental</div>
  <div class="th on"><div class="slide ppt"><div class="mark">HARBOUR<br>LIGHTS</div></div></div>
  <div class="th">Kestrel<br>Logistics</div><div class="th">Ashby &amp; Co</div><div class="th" style="background:#555;color:#fff">Thank you</div>
</div></body></html>
